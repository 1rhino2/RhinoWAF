name: Build, Test & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  security-events: write
  pull-requests: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=10m --config=.golangci.yml --verbose

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: "-fmt json -out gosec-report.json -no-fail -exclude-dir=benchmarks -exclude=G104,G307 ./..."

      - name: Display security report
        if: always()
        run: |
          if [ -f gosec-report.json ]; then
            echo "Security scan completed. Review gosec-report.json for details."
            cat gosec-report.json | jq -r '.Issues[] | "\(.severity): \(.file):\(.line) - \(.details)"' || cat gosec-report.json
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with race detection
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-rhinowaf

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Compute version
        id: ver
        run: |
          # a tag build stamps the tag; a branch build stamps git describe
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Build binary for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME=rhinowaf-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
              OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -v -trimpath \
            -ldflags="-s -w -X main.Version=${{ steps.ver.outputs.version }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${OUTPUT_NAME}" ./cmd/rhinowaf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhinowaf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rhinowaf-*
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    # only cut a release when a v* tag is pushed, not on every commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
              cd "$dir"
              for file in rhinowaf-*; do
                  if [ -f "$file" ]; then
                      sha256sum "$file" > "$file.sha256"
                      if [[ ! "$file" =~ \.exe$ ]]; then
                          tar -czf "../../release/${file}.tar.gz" "$file" "$file.sha256"
                      else
                          zip "../../release/${file}.zip" "$file" "$file.sha256"
                      fi
                  fi
              done
              cd ..
          done

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          cat > release_notes.md << EOF
          ## RhinoWAF ${TAG}

          Self-hosted Go WAF. Prebuilt binaries below for Linux, macOS and Windows.

          ### Install

          \`\`\`bash
          tar -xzf rhinowaf-linux-amd64.tar.gz
          chmod +x rhinowaf-linux-amd64
          ./rhinowaf-linux-amd64 -version
          \`\`\`

          Config lives in \`config/\` (ip_rules.json, geoip.json, backends.json, features.json).
          Point flags at your paths: \`-config-dir\`, \`-log-dir\`, \`-listen\`, \`-backend\`.

          ### Build details

          - Go 1.24+, static build (CGO_ENABLED=0)
          - Symbols stripped (-s -w), reproducible paths (-trimpath)
          - SHA256 checksum shipped next to every binary

          ### Changes
          EOF
          if [ -n "${PREV_TAG}" ]; then
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> release_notes.md
          else
            git log --pretty=format:"- %s (%h)" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "RhinoWAF ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release/*.tar.gz
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
